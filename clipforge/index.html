<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>StoryForge</title>
<style>
:root{--bg:#08080c;--panel:#111119;--line:#272733;--text:#fff;--muted:#9999a8;--accent:#9b5cff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.app{max-width:1180px;margin:auto;padding:18px clamp(12px,3vw,28px) 40px}.head{margin-bottom:16px}.logo{font-size:clamp(27px,7vw,36px);font-weight:850;letter-spacing:-1.5px}.logo span{color:var(--accent)}.sub{color:var(--muted);font-size:14px;margin-top:3px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:20px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px}h2{font-size:18px;margin:0 0 12px}label{display:block;color:var(--muted);font-size:13px;margin:14px 0 7px}textarea,select,input[type=file]{width:100%;background:#09090e;color:#fff;border:1px solid #30303c;border-radius:11px;padding:11px;font:inherit}textarea{min-height:220px;resize:vertical;line-height:1.5;outline:none}textarea:focus,select:focus{border-color:var(--accent)}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}input[type=range]{width:100%;accent-color:var(--accent)}.value{float:right;color:#b07cff}button{width:100%;border:0;border-radius:11px;padding:13px;margin-top:11px;font-weight:750;font-size:15px;background:var(--accent);color:white;cursor:pointer}button.secondary{background:#22222c}button:disabled{opacity:.5;cursor:not-allowed}.preview-wrap{display:flex;justify-content:center}.preview{width:min(100%,360px);aspect-ratio:9/16;border-radius:18px;overflow:hidden;background:#000;box-shadow:0 18px 60px #0008}.preview canvas{width:100%;height:100%;display:block}.progress{height:5px;background:#22222b;border-radius:9px;margin-top:10px;overflow:hidden}.progress>div{height:100%;width:0;background:var(--accent)}.status{font-size:12px;color:var(--muted);margin-top:9px;min-height:18px}.tts-box{margin-top:14px;padding:12px;border:1px solid var(--line);border-radius:12px;background:#0d0d13}.tts-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.tts-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}.tts-actions button{margin-top:9px}.notice{margin-top:12px;padding:10px;border:1px solid var(--line);border-radius:10px;color:var(--muted);font-size:12px;line-height:1.4}
@media(max-width:820px){.app{padding-top:12px}.layout{grid-template-columns:1fr}.preview-wrap{order:-1}.preview{width:min(72vw,330px)}.panel{padding:15px}textarea{min-height:170px}.row{grid-template-columns:1fr 1fr}}
@media(max-width:430px){.preview{width:76vw}.row{grid-template-columns:1fr}.logo{font-size:29px}.app{padding-left:10px;padding-right:10px}}
</style></head>
<body><main class="app">
<header class="head"><div class="logo">Story<span>Forge</span></div><div class="sub">Stories → short-form videos</div></header>
<div class="layout"><section class="panel">
<h2>🎬 Create a Short</h2>
<label for="story">Story / Reddit post</label><textarea id="story" placeholder="Wklej historię tutaj..."></textarea>
<label for="background">Tło — zdjęcie albo film</label><input id="background" type="file" accept="image/*,video/mp4,video/webm">
<div class="row"><div><label>Styl</label><select id="style"><option value="dark">Dark</option><option value="purple">Purple</option><option value="clean">Clean</option></select></div><div><label>Czas sceny</label><select id="duration"><option value="2">2 s</option><option value="3" selected>3 s</option><option value="4">4 s</option></select></div></div>
<div class="tts-box">
<h3 style="margin:0 0 8px;font-size:15px">🔊 TTS / lektor</h3>
<div class="tts-grid"><select id="voice" aria-label="Głos TTS"></select><select id="ttsRate" aria-label="Szybkość TTS"><option value="0.85">Wolniej</option><option value="1" selected>Normalnie</option><option value="1.15">Szybciej</option></select></div>
<div class="tts-actions"><button id="speakBtn" type="button">▶ Odtwórz głos</button><button id="stopSpeakBtn" class="secondary" type="button">■ Stop</button></div>
<div style="font-size:11px;color:var(--muted);margin-top:7px">Głosy pochodzą z przeglądarki/telefonu.</div>
</div>
<label>Przyciemnienie <span class="value" id="dimValue">45%</span></label><input id="dim" type="range" min="0" max="80" value="45">
<label>Dopasowanie tła</label><select id="fit"><option value="cover">Cover</option><option value="contain">Contain</option></select>
<button id="previewBtn">▶ Podgląd</button><button id="exportBtn">📥 Eksport WebM</button><button id="clearBtn" class="secondary">Wyczyść</button>
<div class="notice">Eksport jest renderowany klatka po klatce. TTS działa w podglądzie; głosu z speechSynthesis nie można bezpośrednio nagrać do MediaRecorder.</div>
</section>
<section class="preview-wrap"><div><div class="preview"><canvas id="canvas"></canvas></div><div class="progress"><div id="progress"></div></div><div id="status" class="status">Wklej tekst i uruchom podgląd.</div></div></section>
</div></main>
<script>
const $=id=>document.getElementById(id), c=$('canvas'),ctx=c.getContext('2d');
const story=$('story'),bgInput=$('background'),styleInput=$('style'),durInput=$('duration'),dim=$('dim'),dimValue=$('dimValue'),fit=$('fit'),previewBtn=$('previewBtn'),exportBtn=$('exportBtn'),clearBtn=$('clearBtn'),status=$('status'),progress=$('progress');
const voiceSelect=$('voice'),ttsRate=$('ttsRate'),speakBtn=$('speakBtn'),stopSpeakBtn=$('stopSpeakBtn');
const MAX_STORY_CHARS=100000;
const MAX_BACKGROUND_BYTES=2*1024*1024*1024;
let voices=[];
let scenes=[],bg=null,bgType=null,bgURL=null,video=null,raf=0,playing=false;
function setupCanvas(){const mobile=innerWidth<700||/Android|iPhone|iPad|iPod/i.test(navigator.userAgent);c.width=mobile?540:720;c.height=mobile?960:1280}setupCanvas();addEventListener('resize',()=>{setupCanvas();draw(0,0)});
function split(t){t=t.replace(/\s+/g,' ').trim();if(!t)return[];const words=t.split(' '),out=[];let s='';for(const w of words){if((s+' '+w).trim().length>100){if(s)out.push(s.trim());s=w}else s+=(s?' ':'')+w}if(s)out.push(s.trim());return out}
function wrap(text,max,font){ctx.font=`700 ${font}px Arial`;const out=[];let line='';for(const w of text.split(' ')){const test=line?line+' '+w:w;if(ctx.measureText(test).width>max){if(line)out.push(line);line=w}else line=test}if(line)out.push(line);return out}
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function loadVoices(){
if(!('speechSynthesis' in window)){voiceSelect.innerHTML='<option>Brak obsługi TTS</option>';speakBtn.disabled=true;stopSpeakBtn.disabled=true;return;}
voices=speechSynthesis.getVoices();voiceSelect.innerHTML='';
const preferred=voices.filter(v=>/^pl(-|$)/i.test(v.lang));const list=preferred.length?preferred:voices;
list.forEach(v=>{const o=document.createElement('option');o.value=v.name+'|||'+v.lang;o.textContent=v.name+' ('+v.lang+')';voiceSelect.appendChild(o)});
if(preferred.length)voiceSelect.value=preferred[0].name+'|||'+preferred[0].lang;
}
function speakStory(){const text=story.value.trim();if(!text||!('speechSynthesis' in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);const key=voiceSelect.value.split('|||');const v=voices.find(x=>x.name===key[0]&&x.lang===key[1]);if(v)u.voice=v;u.lang=v?.lang||'pl-PL';u.rate=+ttsRate.value;u.pitch=1;u.volume=1;u.onstart=()=>status.textContent='🔊 TTS odtwarza tekst...';u.onend=()=>status.textContent='TTS zakończony.';u.onerror=()=>status.textContent='Nie udało się uruchomić TTS.';speechSynthesis.speak(u)}
speakBtn.onclick=speakStory;stopSpeakBtn.onclick=()=>{if('speechSynthesis'in window)speechSynthesis.cancel();status.textContent='TTS zatrzymany.'};
if('speechSynthesis'in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices}else loadVoices();

function bgDraw(){ctx.fillStyle='#08080c';ctx.fillRect(0,0,c.width,c.height);if(!bg)return;const sw=bgType==='video'?bg.videoWidth:bg.width,sh=bgType==='video'?bg.videoHeight:bg.height;if(!sw||!sh)return;const scale=fit.value==='cover'?Math.max(c.width/sw,c.height/sh):Math.min(c.width/sw,c.height/sh),w=sw*scale,h=sh*scale;ctx.drawImage(bg,(c.width-w)/2,(c.height-h)/2,w,h);ctx.fillStyle=`rgba(0,0,0,${+dim.value/100})`;ctx.fillRect(0,0,c.width,c.height)}
function draw(i=0,p=0){bgDraw();if(!scenes.length){ctx.fillStyle='white';ctx.font='700 34px Arial';ctx.textAlign='center';ctx.fillText('Your story goes here',c.width/2,c.height/2);return}let fs=c.width<600?38:52;if(scenes[i].length>120)fs-=5;if(scenes[i].length>170)fs-=5;const lines=wrap(scenes[i],c.width-110,fs),lh=fs*1.18,bh=lines.length*lh+64,bw=c.width-70,x=(c.width-bw)/2,y=(c.height-bh)/2;let box='rgba(0,0,0,.60)',tc='#fff';if(styleInput.value==='purple')box='rgba(70,30,120,.76)';if(styleInput.value==='clean'){box='rgba(255,255,255,.9)';tc='#111'}ctx.fillStyle=box;roundRect(x,y,bw,bh,24);ctx.fill();ctx.fillStyle=tc;ctx.font=`700 ${fs}px Arial`;ctx.textAlign='center';ctx.textBaseline='middle';let yy=y+bh/2-(lines.length-1)*lh/2;for(const line of lines){ctx.fillText(line,c.width/2,yy);yy+=lh}ctx.globalAlpha=.8;ctx.font='600 18px Arial';ctx.fillText('StoryForge',c.width/2,45);ctx.globalAlpha=1;ctx.fillStyle=styleInput.value==='clean'?'#111':'#fff';ctx.globalAlpha=.8;ctx.fillRect(25,c.height-28,(c.width-50)*p,4);ctx.globalAlpha=1}
function prepare(){if(story.value.length>MAX_STORY_CHARS){status.textContent='Tekst jest za dĹ‚ugi (maks. 100 000 znakĂłw).';return false}scenes=split(story.value);if(!scenes.length){status.textContent='Wklej tekst najpierw.';return false}return true}
bgInput.onchange=()=>{const f=bgInput.files[0];if(!f)return;if(f.size>MAX_BACKGROUND_BYTES){status.textContent='TĹ‚o jest za duĹĽe (maks. 2 GiB).';bgInput.value='';return}if(bgURL)URL.revokeObjectURL(bgURL);bgURL=URL.createObjectURL(f);if(f.type.startsWith('video/')){bgType='video';video=document.createElement('video');video.src=bgURL;video.muted=true;video.loop=true;video.playsInline=true;video.preload='auto';video.onloadeddata=()=>{bg=video;draw(0);status.textContent='Tło wideo załadowane.'}}else{bgType='image';const im=new Image();im.onload=()=>{bg=im;draw(0);status.textContent='Tło załadowane.'};im.src=bgURL}};
dim.oninput=()=>{dimValue.textContent=dim.value+'%';if(!playing)draw(0)};
async function play(){if(!prepare()||playing)return;playing=true;previewBtn.disabled=true;if(video){video.currentTime=0;try{await video.play()}catch{}}const ms=+durInput.value*1000,total=ms*scenes.length,start=performance.now();const frame=now=>{if(!playing)return;const e=now-start;if(e>=total){playing=false;previewBtn.disabled=false;if(video)video.pause();draw(scenes.length-1,1);progress.style.width='100%';status.textContent='Podgląd gotowy.';return}const i=Math.min(scenes.length-1,Math.floor(e/ms));draw(i,(e%ms)/ms);progress.style.width=e/total*100+'%';status.textContent=`Scena ${i+1}/${scenes.length}`;raf=requestAnimationFrame(frame)};raf=requestAnimationFrame(frame)}
function stop(){playing=false;cancelAnimationFrame(raf);if(video)video.pause();previewBtn.disabled=false}
previewBtn.onclick=play;
async function exportVideo(){
if(!prepare())return;
stop();
exportBtn.disabled=true;
previewBtn.disabled=true;
progress.style.width='0%';
status.textContent='Przygotowywanie…';

const mobile=innerWidth<700||/Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
// Nie renderujemy ogromnego canvasu na telefonie.
setupCanvas();

const fps=mobile?20:30;
const candidates=mobile?['video/webm;codecs=vp8','video/webm']:['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'];
const mime=candidates.find(x=>MediaRecorder.isTypeSupported(x));
if(!mime){status.textContent='Ta przeglądarka nie obsługuje WebM.';exportBtn.disabled=false;previewBtn.disabled=false;return}

// Dajemy przeglądarce klatkę na odświeżenie UI przed ciężkim renderem.
await new Promise(r=>setTimeout(r,120));

if(video){
  video.pause();
  try{video.currentTime=0}catch{}
  // Nie czekamy na video.play(). To potrafi blokować eksport na telefonach.
  try{const p=video.play();if(p&&p.catch)p.catch(()=>{})}catch{}
}

const stream=c.captureStream(fps);
const recorder=new MediaRecorder(stream,{mimeType,videoBitsPerSecond:mobile?2200000:6500000});
const chunks=[];
let recorderError=null;
recorder.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
recorder.onerror=e=>{recorderError=e.error||new Error('MediaRecorder error')};
const stopped=new Promise(resolve=>recorder.onstop=resolve);

try{
  recorder.start(250);
}catch(e){
  status.textContent='Nie udało się uruchomić eksportu.';
  exportBtn.disabled=false;previewBtn.disabled=false;return;
}

status.textContent='Renderowanie 0%';
await new Promise(resolve=>{
  const ms=+durInput.value*1000;
  const total=Math.max(ms*scenes.length,1000);
  const start=performance.now();
  let lastPaint=0;
  const loop=now=>{
    const elapsed=now-start;
    if(elapsed>=total){
      draw(scenes.length-1,1);
      progress.style.width='100%';
      status.textContent='Renderowanie 100%';
      resolve();
      return;
    }
    const i=Math.min(scenes.length-1,Math.floor(elapsed/ms));
    const p=(elapsed%ms)/ms;
    draw(i,p);
    // Nie aktualizujemy DOM co każdą klatkę — na telefonie powoduje to przycięcia.
    if(now-lastPaint>120){
      const pct=Math.floor(elapsed/total*100);
      progress.style.width=pct+'%';
      status.textContent=`Renderowanie ${pct}%`;
      lastPaint=now;
    }
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
});

if(video)video.pause();
await new Promise(r=>setTimeout(r,80));
recorder.stop();
await stopped;

if(recorderError||!chunks.length){
  status.textContent='Eksport nie powiódł się. Spróbuj ponownie.';
  exportBtn.disabled=false;previewBtn.disabled=false;return;
}

const blob=new Blob(chunks,{type:mime});
const url=URL.createObjectURL(blob);
const a=document.createElement('a');
a.href=url;
a.download='storyforge-short.webm';
document.body.appendChild(a);a.click();a.remove();
setTimeout(()=>URL.revokeObjectURL(url),5000);
status.textContent='✅ Gotowe — film pobrany.';
progress.style.width='100%';
exportBtn.disabled=false;
previewBtn.disabled=false;
}
exportBtn.onclick=exportVideo;
clearBtn.onclick=()=>{stop();if(video){try{video.pause();video.removeAttribute('src');video.load()}catch{}}story.value='';bgInput.value='';scenes=[];bg=null;video=null;if(bgURL)URL.revokeObjectURL(bgURL);bgURL=null;progress.style.width='0';status.textContent='Wklej tekst i uruchom podgląd.';draw()};
story.oninput=()=>{if(!playing){prepare();draw(0)}};styleInput.onchange=()=>!playing&&draw(0);fit.onchange=()=>!playing&&draw(0);draw();
</script></body></html>
