<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#000000" />
  <title>Undertale Web Player</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
</head>
<body>
  <div id="app">
    <!-- ==== Ekran startowy / upload ==== -->
    <section id="upload-screen" class="screen active">
      <div class="logo">
        <h1 class="retro-title">UNDERTALE</h1>
        <p class="retro-subtitle">WEB PLAYER</p>
      </div>

      <div id="drop-zone" class="drop-zone">
        <p class="drop-text">Przeciągnij i upuść plik <strong>.zip</strong> lub <strong>data.win</strong></p>
        <p class="drop-hint">lub</p>
        <label for="file-input" class="retro-btn">WYBIERZ PLIK</label>
        <input type="file" id="file-input" accept=".zip,.win,.ogg" multiple hidden />
        <label for="folder-input" class="retro-btn secondary">WYBIERZ FOLDER</label>
        <input type="file" id="folder-input" webkitdirectory multiple hidden />
      </div>

      <div id="file-list-container" class="file-list-container hidden">
        <h3 class="retro-label">WGRANE PLIKI</h3>
        <ul id="file-list" class="file-list"></ul>
        <div class="action-row">
          <button id="start-btn" class="retro-btn">URUCHOM GRĘ</button>
          <button id="reset-btn" class="retro-btn danger">RESETUJ DANE</button>
        </div>
      </div>

      <div id="storage-status" class="storage-status"></div>
    </section>

    <!-- ==== Ekran gry ==== -->
    <section id="game-screen" class="screen">
      <div id="canvas-wrapper" class="canvas-wrapper">
        <canvas id="game-canvas" width="640" height="480"></canvas>
      </div>

      <!-- Sterowanie dotykowe -->
      <div id="touch-controls" class="touch-controls hidden">
        <div class="dpad">
          <button class="dpad-btn up"    data-key="ArrowUp">▲</button>
          <button class="dpad-btn left"  data-key="ArrowLeft">◀</button>
          <button class="dpad-btn right" data-key="ArrowRight">▶</button>
          <button class="dpad-btn down"  data-key="ArrowDown">▼</button>
        </div>
        <div class="action-buttons">
          <button class="action-btn" data-key="z">Z</button>
          <button class="action-btn" data-key="x">X</button>
          <button class="action-btn" data-key="c">C</button>
        </div>
      </div>

      <!-- Diagnostyka -->
      <div id="log-panel" class="log-panel">
        <div class="log-header">
          <span class="retro-label">DIAGNOSTYKA</span>
          <button id="clear-log" class="log-clear">✕</button>
        </div>
        <pre id="log-output" class="log-output"></pre>
      </div>
    </section>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
